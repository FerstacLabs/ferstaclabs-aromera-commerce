services:
  postgres:
    image: postgres:16
    container_name: aromera-postgres
    environment:
      POSTGRES_DB: aromera_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=aromera_commerce;Username=postgres;Password=postgres
      Jwt__Issuer: AromeraCommerce
      Jwt__Audience: AromeraCommerce
      Jwt__Secret: CHANGE_ME_TO_LONG_RANDOM_SECRET_CHANGE_ME
      FrontendUrl: http://localhost:3000
      Payments__DefaultProvider: Mock
    ports:
      - "5000:5000"

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aromera.az
      PGADMIN_DEFAULT_PASSWORD: Admin123!ChangeMe
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
